name: Build Gokul TTS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Complete Android Structure
        run: |
          if [ -f "project-bolt-sb1-rkcwftwf.zip" ]; then
            unzip -o project-bolt-sb1-rkcwftwf.zip -d temp_bolt
            cp -rn temp_bolt/project/* . 2>/dev/null || cp -rn temp_bolt/* .
            rm -rf temp_bolt
          fi

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Gokul-TTS"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/gokul/tts

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.gokul.tts"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.gokul.tts"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Gokul TTS</string>
          </resources>
          EOF
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Gokul TTS"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        continue-on-error: true
        run: |
          gradle assembleDebug > build_output.log 2>&1

      - name: Save Result to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk Gokul-TTS.apk
            rm -f error.txt
            git add Gokul-TTS.apk
            git commit -m "Build Gokul-TTS.apk successful" || true
          else
            grep -E "FAILURE:|What went wrong:|> |e: " -A 5 -B 2 build_output.log | head -n 80 > error.txt
            if [ ! -s error.txt ]; then
              head -n 80 build_output.log > error.txt
            fi
            git add error.txt
            git commit -m "Save clear build error" || true
          fi
          git push

concurrency: 
