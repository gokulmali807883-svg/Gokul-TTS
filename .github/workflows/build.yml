name: Build Gokul TTS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Bolt ZIP
        run: |
          if [ -f "project-bolt-sb1-rkcwftwf.zip" ]; then
            unzip -o project-bolt-sb1-rkcwftwf.zip -d temp_bolt
            cp -rn temp_bolt/project/* . 2>/dev/null || cp -rn temp_bolt/* .
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gokul-TTS-APK
          path: app/build/outputs/apk/debug/app-debug.apk

